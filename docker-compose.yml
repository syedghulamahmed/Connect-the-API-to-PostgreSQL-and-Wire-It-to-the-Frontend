services:
  postgres:
    image: postgres:16-alpine
    container_name: talentbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talentbridge
      POSTGRES_PASSWORD: talentbridge
      POSTGRES_DB: talentbridge
    ports:
      - "5432:5432"
    volumes:
      - talentbridge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentbridge -d talentbridge"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  talentbridge_pgdata:
